name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  native-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ["2026.9.4", "stable"]
    steps:
      - uses: actions/checkout@v7
      - name: Test against Home Assistant ${{ matrix.homeassistant }}
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace
          -e PYTHONPATH=/workspace/custom_components
          -e PYTHONDONTWRITEBYTECODE=1
          --entrypoint /bin/sh
          ghcr.io/home-assistant/home-assistant:${{ matrix.homeassistant }}
          -c 'python3 -m pip install --quiet --no-cache-dir yalexs==9.2.13 && python3 -B -m unittest discover -s tests -v'
