delete_access:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    access_id:
      required: true
      selector:
        text:

cancel_pending_access:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    access_id:
      required: true
      selector:
        text:
    pin:
      required: true
      selector:
        text:
          type: password

disable_access:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    access_id:
      required: true
      selector:
        text:

enable_access:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    access_id:
      required: true
      selector:
        text:

bind_person:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    access_id:
      required: true
      selector:
        text:
    person_entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: person
    notification_entry_id:
      selector:
        config_entry:
          integration: mobile_app
    clear_notification:
      selector:
        boolean:

unbind_person:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    access_id:
      required: true
      selector:
        text:

confirm_delivery:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    access_id:
      required: true
      selector:
        text:
    receipt_action:
      required: true
      selector:
        text:

issue_access:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    person_entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: person
    validity_minutes:
      default: 10
      selector:
        number:
          min: 5
          max: 30
          mode: box
          unit_of_measurement: min
    language:
      selector:
        select:
          options: [en, es]

begin_visit:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    person_entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: person
    cooldown_minutes:
      default: 30
      selector:
        number:
          min: 5
          max: 120
          mode: box
          unit_of_measurement: min

end_visit:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: yale_access_manager
    person_entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: person
